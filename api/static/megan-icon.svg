<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <!-- Background subtle glow -->
    <filter id="coral-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#f43f5e" flood-opacity="0.35"/>
    </filter>

    <!-- Sunset Coral Gradients -->
    <linearGradient id="coral-left" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb7185" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>

    <linearGradient id="coral-right" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#be123c" />
    </linearGradient>

    <linearGradient id="coral-center" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fda4af" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>

    <radialGradient id="spark-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="50%" stop-color="#fda4af" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#f43f5e" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Deep Matte Carbon Base -->
  <rect x="8" y="8" width="112" height="112" rx="28" fill="#121216" stroke="#27272a" stroke-width="2" filter="url(#coral-glow)"/>

  <!-- Geometric "M" Ribbons -->
  <!-- Left Pillar -->
  <path d="M 32 88 L 32 44 C 32 37.37 37.37 32 44 32 C 48.2 32 51.9 34.1 54.2 37.5 L 64 52 L 48 88 Z" 
        fill="url(#coral-left)" />

  <!-- Right Pillar -->
  <path d="M 96 88 L 96 44 C 96 37.37 90.63 32 84 32 C 79.8 32 76.1 34.1 73.8 37.5 L 64 52 L 80 88 Z" 
        fill="url(#coral-right)" />

  <!-- Center Connecting Chevrons -->
  <path d="M 44 88 L 64 58 L 84 88 L 72 88 L 64 74 L 56 88 Z" 
        fill="url(#coral-center)" opacity="0.95" />

  <!-- Apex Neural Sparkle -->
  <circle cx="64" cy="40" r="4.5" fill="url(#spark-glow)" />
  <circle cx="64" cy="40" r="1.5" fill="#ffffff" />
</svg>
