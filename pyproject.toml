[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "megan"
version = "0.1.0"
description = "Extensible desktop AI intelligence system powered by high-throughput cloud gateway and local OS automation"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Megan Research Team", email = "team@megan-ai.local"}
]
keywords = [
    "desktop-assistant",
    "ai-assistant",
    "pc-automation",
    "screen-copilot",
    "visual-memory",
    "multimodal-ai"
]

[project.scripts]
megan = "main:main"

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]

[tool.isort]
profile = "black"
line_length = 100

[tool.ruff]
line-length = 100
select = ["E", "F", "W", "I"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--cov=. --cov-report=term-missing"
