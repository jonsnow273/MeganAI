# Megan Master Configuration
# Core Identity: Privacy-First AI Desktop Assistant with Multimodal Screen Copilot

assistant:
  name: "Megan"
  tagline: "Multimodal Desktop AI Assistant"
  wake_phrase: "hey megan"
  default_language: "en"

# LLM Gateway Core
llm:
  model_name: "kilo-auto/free"
  vision_model: "nvidia/nemotron-3.5-super-vl:free"
  alternate_model: "nvidia/nemotron-3.5-lightning:free"
  max_new_tokens: 1024
  temperature: 0.7
  top_p: 0.9

# PC Automation & Safety Boundaries
automation:
  confirmation_required: true     # Destructive actions mandate explicit user confirmation
  safe_delete: true               # Route deletions to system Recycle Bin (send2trash)
  sandbox_mode: false             # Set to true for dry-run simulation only

# Voice Pipeline
voice:
  enabled: true
  microphone_index: null           # null = system default microphone
  wake_word_sensitivity: 0.5      # 0.0 (high sensitivity) to 1.0 (strict)
  silence_timeout_seconds: 3

# UI & Tray
tray:
  enabled: true
  minimize_to_tray: true
  show_notifications: true
